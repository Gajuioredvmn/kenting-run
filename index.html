<style>
/* Arcade cabinet look: a sunset palette (night indigo, magenta, hot orange, sea teal), chunky italic numerals, pixel labels. */
:root{
  --night:#120c2a;       /* page ground */
  --ink:#0b0718;
  --panel:rgba(18,12,42,.72);
  --line:rgba(255,236,210,.22);
  --cream:#fff3dc;       /* text */
  --sun:#ffb23e;         /* primary accent: time, gold */
  --hot:#ff4f6d;         /* danger, redline */
  --sea:#3fd0d4;         /* secondary accent */
  --lime:#b6f26a;        /* go */
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Russo One","Noto Sans TC",system-ui,sans-serif;
  --font-pix:"Press Start 2P","Noto Sans TC",monospace;
  --sl:max(16px, env(safe-area-inset-left, 0px));
  --sr:max(16px, env(safe-area-inset-right, 0px));
  --st:env(safe-area-inset-top, 0px);
  --sb:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);overflow:hidden;overscroll-behavior:none;
  font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
canvas#gl,canvas#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#gl{touch-action:none;background:var(--night);image-rendering:pixelated;object-fit:contain}
canvas#hud{pointer-events:none;z-index:3}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:18px;background:var(--night);z-index:99}

/* ---------- screens ---------- */
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui .scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#s-title{background:radial-gradient(ellipse at 50% 42%,rgba(10,6,24,.62),rgba(10,6,24,.18) 58%,rgba(10,6,24,0) 75%)}
#ui .scr.dim{background:radial-gradient(ellipse at 50% 40%,rgba(18,12,42,.35),rgba(10,6,24,.82))}
.panel{background:linear-gradient(180deg,rgba(28,16,64,.93),rgba(12,8,30,.95));border:2px solid var(--sun);border-radius:14px;
  box-shadow:0 0 0 3px rgba(10,6,24,.85),0 14px 40px rgba(0,0,0,.55);color:var(--cream)}
.btn{font:900 clamp(15px,2.4vh,19px)/1 var(--font-ui);color:var(--night);background:linear-gradient(180deg,#ffe08a,var(--sun));border-radius:10px;
  padding:.62em 1.2em;box-shadow:0 4px 0 #9a5a10,0 6px 14px rgba(0,0,0,.4);letter-spacing:.06em;transform:skewX(-6deg);transition:transform .08s,filter .08s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:skewX(-6deg) translateY(3px);box-shadow:0 1px 0 #9a5a10}
.btn.big{font-size:clamp(18px,3.4vh,26px);padding:.6em 1.5em;background:linear-gradient(180deg,#ff9a6a,var(--hot));color:#fff;box-shadow:0 4px 0 #8a1a3a,0 8px 18px rgba(0,0,0,.45);text-shadow:0 2px 0 #8a1a3a}
.btn.ghost{background:rgba(255,243,220,.08);color:var(--cream);box-shadow:inset 0 0 0 2px rgba(255,243,220,.35)}
.btn.sea{background:linear-gradient(180deg,#8af0f2,var(--sea));box-shadow:0 4px 0 #1a6a7a,0 6px 14px rgba(0,0,0,.4)}
.btn[aria-pressed="true"]{background:linear-gradient(180deg,#b6ffd0,var(--lime));box-shadow:0 4px 0 #3a7a2a,0 0 0 3px #fff3dc}
.pix{font-family:var(--font-pix);letter-spacing:.08em}
h2.ttl{margin:0 0 .5em;font:900 clamp(18px,3.2vh,26px)/1.1 var(--font-ui);color:var(--sun);letter-spacing:.08em;transform:skewX(-8deg);text-shadow:0 3px 0 #140c2a}
/* title */
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.4vh,22px);text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;transform:skewX(-10deg)}
.logo-tc{font:900 clamp(46px,15vh,112px)/1 var(--font-ui);letter-spacing:.04em;color:#ffd23a;
  text-shadow:-2px -2px 0 #1a0c30,2px -2px 0 #1a0c30,-2px 2px 0 #1a0c30,2px 2px 0 #1a0c30,0 4px 0 #ff6a2a,0 6px 0 #ff3a7a,0 8px 0 #c01a5a,0 10px 0 #1a0c30,0 0 30px rgba(255,140,60,.55)}
.logo-en{font:400 clamp(20px,6vh,46px)/1 var(--font-num);letter-spacing:.32em;margin-top:.22em;color:#e8f6ff;
  text-shadow:-1px -1px 0 #10183a,1px -1px 0 #10183a,-1px 1px 0 #10183a,1px 1px 0 #10183a,0 3px 0 #3a6ad8,0 5px 0 #10183a}
.logo-yr{font:700 clamp(11px,2.2vh,15px)/1 var(--font-ui);color:var(--cream);letter-spacing:.3em;margin-top:.9em;text-shadow:0 2px 0 #140c2a,0 0 6px #140c2a}
.tap{font:400 clamp(12px,2.4vh,16px)/1 var(--font-pix);color:#fff;text-shadow:0 2px 0 #140c2a;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.menu{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,12px);align-items:stretch;min-width:min(260px,70vw)}
.foot{position:absolute;bottom:max(8px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:500 11px var(--font-ui);color:rgba(255,243,220,.7)}
/* car select */
.sel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:clamp(6px,1.6vh,14px);width:min(1100px,100%);height:min(640px,100%)}
.show{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;border-radius:14px;
  background:radial-gradient(ellipse at 50% 78%,rgba(255,210,58,.28),rgba(255,210,58,0) 55%),linear-gradient(180deg,rgba(40,24,90,.55),rgba(14,8,32,.75));border:2px solid rgba(255,243,220,.18)}
.show canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.show .arrow{position:absolute;top:50%;transform:translateY(-50%);font:900 26px var(--font-num);color:var(--sun);width:48px;height:64px;border-radius:10px;background:rgba(10,6,24,.55)}
.show .arrow.l{left:6px} .show .arrow.r{right:6px}
.badge{position:absolute;top:10px;left:12px;display:flex;gap:6px}
.badge span{font:400 11px var(--font-pix);padding:6px 8px;border-radius:6px;background:rgba(10,6,24,.75);color:var(--sea);border:1px solid rgba(63,208,212,.6)}
.badge span.g6{color:var(--sun);border-color:rgba(255,178,62,.7)}
.info{padding:clamp(10px,2vh,18px) clamp(12px,2vw,20px);display:flex;flex-direction:column;gap:clamp(5px,1.1vh,10px);min-height:0;overflow:auto}
.nm b{display:block;font:900 clamp(24px,5.4vh,40px)/1 var(--font-ui);color:#fff;transform:skewX(-8deg);text-shadow:0 3px 0 #140c2a}
.nm span{font:400 clamp(11px,1.8vh,13px)/1 var(--font-pix);color:var(--sun);letter-spacing:.14em}
.desc{margin:0;font:500 clamp(12px,2vh,15px)/1.5 var(--font-ui);color:var(--cream)}
.crew{font:700 clamp(11px,1.8vh,13px)/1.4 var(--font-ui);color:var(--sea)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center}
.stats .l{font:700 clamp(11px,1.8vh,13px)/1 var(--font-ui);color:var(--cream)}
.stats .v{font:400 10px var(--font-pix);color:#fff}
.bar{height:clamp(8px,1.4vh,11px);border-radius:3px;background:rgba(255,243,220,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--lime),var(--sun),var(--hot));background-size:200px 100%}

.thumbs canvas{width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
.sel .actions{grid-column:2/3;display:flex;gap:10px;justify-content:flex-end;align-items:center}
/* setup, pause, results, records, settings */
.card{padding:clamp(12px,2.6vh,24px) clamp(14px,3vw,30px);width:min(720px,100%);max-height:100%;overflow:auto}
.row{display:grid;grid-template-columns:clamp(64px,10vw,96px) 1fr;gap:10px;align-items:center;margin:0 0 clamp(8px,1.8vh,14px)}
.row .lbl{font:900 clamp(13px,2.2vh,16px)/1 var(--font-ui);color:var(--sun)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{font-size:clamp(13px,2.2vh,16px);padding:.55em .9em}
.note{grid-column:2/3;margin:-4px 0 0;font:500 clamp(11px,1.8vh,13px)/1.5 var(--font-ui);color:rgba(255,243,220,.8)}
.radio{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.radio button{text-align:left;padding:.5em .8em;border-radius:10px;background:rgba(255,243,220,.06);color:var(--cream);border:2px solid rgba(255,243,220,.18);font:900 clamp(13px,2.2vh,16px)/1.25 var(--font-ui)}
.radio button small{display:block;font:400 9px var(--font-pix);color:var(--sea);margin-top:3px;letter-spacing:.08em}
.radio button[aria-pressed="true"]{border-color:var(--lime);background:rgba(124,242,106,.14)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.vmenu{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(280px,80vw);padding:22px}
.res-banner{font:400 clamp(30px,8vh,64px)/1 var(--font-num);text-align:center;transform:skewX(-10deg);letter-spacing:.08em;margin:0 0 .2em;filter:drop-shadow(0 4px 0 #140c2a)}
.res-sub{text-align:center;font:700 clamp(13px,2.2vh,16px)/1.4 var(--font-ui);color:var(--cream);margin:0 0 .8em}
table.sp{width:100%;border-collapse:collapse;font:700 clamp(12px,2vh,15px)/1.5 var(--font-ui)}
table.sp td{padding:3px 6px;border-bottom:1px solid rgba(255,243,220,.12)}
table.sp td.t{text-align:right;font-family:var(--font-num);color:#fff}
.new{color:var(--lime);font:400 11px var(--font-pix);margin-left:8px;animation:blink .6s steps(2,end) infinite}
.rng{width:100%;accent-color:var(--sun)}
@media (max-height:430px){.sel{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.desc{display:none}.thumbs button{width:52px}}

#rot{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--night);color:var(--cream);font:900 20px var(--font-ui);text-align:center;padding:24px}
@media (orientation:portrait) and (pointer:coarse){#rot.need{display:flex}}
</style>

<canvas id="hud" aria-hidden="true"></canvas>
<div id="ui"></div>
<script>
(function(){'use strict';
// ===================== core: helpers and the game screen =====================
// The whole game is painted in 2D at a low internal resolution (360 rows) and scaled up with hard pixels,
// the way the arcade boards did it: a road raster, then sprites scaled by distance, back to front.
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const sstep = (t) => t * t * (3 - 2 * t);
const angWrap = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const $ = (id) => document.getElementById(id);
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
// deterministic random numbers: every stage builds the same scenery for every player
function mulberry(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  return f;
}
function strSeed(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u); }
function vnoise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(hash2(xi, zi), hash2(xi + 1, zi), u), lerp(hash2(xi, zi + 1), hash2(xi + 1, zi + 1), u), v);
}
function fbm1(x) { return vnoise1(x) * 0.55 + vnoise1(x * 2.03 + 7.1) * 0.28 + vnoise1(x * 4.11 + 3.3) * 0.17; }
const fmtTime = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return m + "'" + String(Math.floor(s)).padStart(2, '0') + '"' + String(Math.floor((s % 1) * 100)).padStart(2, '0'); };
const kmh = (v) => v * 3.6;
const D2R = Math.PI / 180;

// ---------- the screen ----------
const view = $('gl');
const vctx = view.getContext('2d', { alpha: false });
const glCanvas = view;     // the touch controls listen on the game screen
const RH = 270;            // internal height in game pixels: chunky arcade pixels
let RW = 640;              // internal width follows the shape of the screen
const FOC = 296;           // focal length in game pixels: about 49 degrees of vertical view
let X0 = 320;              // screen centre
const Y0 = 112;            // the horizon line
const PXK = RH / 360;      // backdrop art was laid out for 360 rows
const PANO_W = Math.round(TAU * FOC); // one turn of the horizon in game pixels

// ---------- small helpers ----------
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function hexToRgb(hex) { return [((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255]; }
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return (Math.round(lerp(A[0], B[0], t) * 255) << 16) | (Math.round(lerp(A[1], B[1], t) * 255) << 8) | Math.round(lerp(A[2], B[2], t) * 255);
}
function shadeHex(hex, k) { const A = hexToRgb(hex); return (Math.round(clamp(A[0] * k, 0, 1) * 255) << 16) | (Math.round(clamp(A[1] * k, 0, 1) * 255) << 8) | Math.round(clamp(A[2] * k, 0, 1) * 255); }
const cssHex = (hex) => '#' + (hex & 0xffffff).toString(16).padStart(6, '0');
const rgbaHex = (hex, a) => 'rgba(' + ((hex >> 16) & 255) + ',' + ((hex >> 8) & 255) + ',' + (hex & 255) + ',' + a.toFixed(3) + ')';
// 0xRRGGBB to a little-endian 32-bit pixel (ABGR in memory) for the road raster
const px32 = (hex) => (0xff000000 | ((hex & 255) << 16) | (hex & 0xff00) | ((hex >> 16) & 255)) >>> 0;
const rgb = (hex) => [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];

// ===================== the backdrop: sky, sun, clouds, mountain and skyline layers, time of day =====================
// World directions: the route starts heading south (-Z). Azimuth 0 is south, + toward the west (the sea side).
// A layer is a strip one full turn of the horizon wide (PANO_W game pixels), scrolled by the camera heading.
const SEA_Y = 0;
// sun: [azimuth deg from south toward west, elevation deg]
const TOD = {
  // the bright south Taiwan day every stage is run in: a deep blue sky, light haze, strong colour
  day: { sun: [28, 58], top: 0x2470e0, hor: 0xb8e0f8, low: 0x98c8e0, haze: 0xc8e2f4, glow: 0xfff4d0, tint: 0xffffff, tintA: 0, cl: 0xffffff, cs: 0xa8bcdc, fogN: 340, fogF: 2400, fogMax: 0.5 },
  morning: { sun: [-60, 30], top: 0x2f7fe0, hor: 0xbfe2f6, low: 0x9cc8de, haze: 0xc8e0f0, glow: 0xfff0c8, tint: 0xffffff, tintA: 0, cl: 0xffffff, cs: 0xa8bcdc, fogN: 260, fogF: 2200, fogMax: 0.62 },
  noon: { sun: [10, 66], top: 0x2470dc, hor: 0xb8def6, low: 0x96c4dc, haze: 0xc4e0f2, glow: 0xfff6dc, tint: 0xffffff, tintA: 0, cl: 0xffffff, cs: 0xaabedc, fogN: 280, fogF: 2300, fogMax: 0.6 },
  afternoon: { sun: [62, 34], top: 0x3378d0, hor: 0xd4e4ec, low: 0xa6c0cc, haze: 0xd4e2ea, glow: 0xffdca0, tint: 0xfff0d8, tintA: 0.06, cl: 0xfffaf0, cs: 0xb4b8cc, fogN: 240, fogF: 2100, fogMax: 0.62 },
  golden: { sun: [80, 10], top: 0x3c64b0, hor: 0xf6c08c, low: 0xb08a80, haze: 0xf0c49c, glow: 0xffa860, tint: 0xffb070, tintA: 0.16, cl: 0xffd8b0, cs: 0xb08aa8, fogN: 200, fogF: 1900, fogMax: 0.66 },
  sunset: { sun: [88, 2], top: 0x2c3c7c, hor: 0xf4905e, low: 0x8a5a6a, haze: 0xd8826e, glow: 0xff7a40, tint: 0xff8a50, tintA: 0.24, cl: 0xffa070, cs: 0x7a5a88, fogN: 170, fogF: 1700, fogMax: 0.7 },
  dusk: { sun: [92, -6], top: 0x141c44, hor: 0x8a5a7a, low: 0x3a2c44, haze: 0x5a4a6c, glow: 0xc06070, tint: 0x4a3a7a, tintA: 0.42, cl: 0x9a6a8a, cs: 0x3a3060, fogN: 140, fogF: 1400, fogMax: 0.74 },
};
const TODK = ['top', 'hor', 'low', 'haze', 'glow', 'tint', 'cl', 'cs'], TODN = ['tintA', 'fogN', 'fogF', 'fogMax'];
function todMix(a, b, t, out) {
  out.sunAz = lerp(a.sun[0], b.sun[0], t); out.sunEl = lerp(a.sun[1], b.sun[1], t);
  for (const k of TODK) out[k] = mixHex(a[k], b[k], t);
  for (const k of TODN) out[k] = lerp(a[k], b[k], t);
  return out;
}
const BG = { key: '', next: null, nextKey: '', fade: 0, layers: null, cache: {}, T: todMix(TOD.day, TOD.day, 0, {}) };
const L_FAR = { h: 130, hz: 98 }, L_NEAR = { h: 160, hz: 128 }, L_CLOUD = { h: 158, hz: 150 };
const azX = (azDeg) => ((azDeg * D2R + Math.PI) / TAU) * PANO_W;   // azimuth to layer x
const xAz = (x) => (x / PANO_W) * 360 - 180;                       // layer x to azimuth (deg)

// ---------- mountains, painted per pixel: lit and shaded slopes, gullies, a speckle of tree crowns, mist at their feet ----------
// o: { az0, az1 (deg), base, amp (px above the horizon), rough, seed, peaks: [[azDeg, widthDeg, px]], pal: dark..light, haze, tex, mist, sunAz }
function paintRange(img, hz, o) {
  const W = img.width, H = img.height, d = img.data;
  const pal = o.pal.map(rgb), HZ = rgb(o.haze || 0xc8dcea), n = pal.length;
  const hAt = (az) => {
    const t = (az - o.az0) / (o.az1 - o.az0), edge = o.flat ? 1 : Math.min(1, Math.sin(Math.PI * clamp(t, 0, 1)) * 1.6);
    let h = o.base + o.amp * edge * (fbm1(o.seed + az * o.rough * 0.02) * 0.72 + 0.28 * fbm1(o.seed * 1.7 + az * o.rough * 0.1));
    if (o.peaks) for (const pk of o.peaks) { const q = (az - pk[0]) / pk[1]; h += pk[2] * Math.exp(-q * q); }
    return h * PXK;

  drawLayer(g, set.clouds, camAz * 0.96 + drift, 1, HY - L_CLOUD.hz, alpha);
  drawLayer(g, set.far, camAz, 1, HY - L_FAR.hz, alpha);
  drawLayer(g, set.near, camAz, 1.12, HY - L_NEAR.hz, alpha);
}

// ===================== road: stage pieces, centreline, forks =====================
// A stage is a list of sections (length, peak curvature, rise, cross-section, what lies on each side).
// A Piece is one stage laid into the world from a start point; forks hang two child pieces off the end.
//
// Cross-section, left to right (x is metres from the centre of OUR carriageway, + to the right):
//   [opposite shoulder][opposite lanes 2*O][median M][our lanes -W..W][scooter lane / shoulder SH] | ground
// Traffic on our side runs with us; the opposite carriageway behind the median carries oncoming traffic.
const DS = 2;            // centreline sample spacing (m)
const LANE = 3.5;        // lane width (m)
const OPP_SH = 1.2;      // outer shoulder of the opposite carriageway
const FORK_LEN = 300;    // the widened stretch before a split
const DIVERGE_LEN = 460; // the first stretch of each child, bending away from its sibling
const SEC_DEFAULT = { lanes: 2, sh: 2.4, med: 1.0, mt: 'barrier', opp: 2 };

function curveProfile(t) { return sstep(clamp(t / 0.3, 0, 1)) * sstep(clamp((1 - t) / 0.3, 0, 1)); }

class Piece {
  constructor(stageId, start, opts) {
    const def = STAGES[stageId];
    this.id = stageId; this.def = def; this.opts = opts || {};
    this.side = this.opts.side || 0;           // -1 left child, +1 right child of a fork, 0 plain
    this.parent = this.opts.parent || null;
    this.children = []; this.next = null;      // filled by the route builder
    this.gS = this.opts.gS || 0;               // distance along the route where this piece starts
    this.seed = strSeed(stageId);
    // ---- fill every section's cross-section from the one before it ----
    const stageSecs = [];
    let prev = SEC_DEFAULT;
    for (const s0 of def.sections) {
      const s = Object.assign({}, s0);
      for (const k of ['lanes', 'sh', 'med', 'mt', 'opp']) if (s[k] == null) s[k] = prev[k];
      stageSecs.push(s); prev = s;
    }
    const first = stageSecs[0], last = stageSecs[stageSecs.length - 1];
    // ---- the sections actually laid: a divergence bend for fork children, the stage, a widened fork stretch ----
    const secs = [];
    if (this.side) secs.push(Object.assign({}, first, { len: DIVERGE_LEN, k: this.side * 0.0016, dy: 0, tags: (first.tags || []).filter((t) => t !== 'checkpoint' && t !== 'start'), diverge: true }));
    for (const s of stageSecs) secs.push(s);
    if (def.children && def.children.length === 2) {
      const cl = STAGES[def.children[0]].sections[0].lanes || 2, cr = STAGES[def.children[1]].sections[0].lanes || 2;
      this.forkLanes = [cl, cr];
      this.forkOff = [-(cr * LANE) / 2, (cl * LANE) / 2];         // child centres relative to ours at the split
      this.forkDiv = ((cl - cr) * LANE) / 2;                       // the line between the two carriageways
      secs.push(Object.assign({}, last, { len: FORK_LEN, k: 0, dy: 0, lanes: cl + cr, med: 26, mt: 'plant', tags: ['forksign', 'forktrees'], fork: true }));
    }
    this.secs = secs;
    // ---- integrate the centreline ----
    let n = 0; for (const s of secs) n += Math.round(s.len / DS);
    this.N = n + 1; this.L = n * DS;
    const N = this.N;
    this.X = new Float32Array(N); this.Y = new Float32Array(N); this.Z = new Float32Array(N);
    this.H = new Float32Array(N); this.K = new Float32Array(N);
    this.W = new Float32Array(N); this.SH = new Float32Array(N); this.M = new Float32Array(N); this.O = new Float32Array(N);
    this.SEC = new Uint16Array(N); this.F = new Float32Array(N);
    let x = start.x, y = start.y, z = start.z, h = start.h;
    // cross-section state, eased from section to section
    const cs = this.opts.startCS ? Object.assign({}, this.opts.startCS) : { W: (first.lanes * LANE) / 2, SH: first.sh, M: first.med, O: first.opp ? (first.opp * LANE) / 2 : 0 };
    if (this.side === 1) { cs.M = 0; cs.O = 0; }     // nothing on the inner side of a right branch at first
    if (this.side === -1) cs.SH = 0;                 // nor beside the inner edge of a left branch
    this.X[0] = x; this.Y[0] = y; this.Z[0] = z; this.H[0] = h;
    this.W[0] = cs.W; this.SH[0] = cs.SH; this.M[0] = cs.M; this.O[0] = cs.O;
    let idx = 0;
    this.secStartS = [];
    for (let j = 0; j < secs.length; j++) {
      const s = secs[j], m = Math.round(s.len / DS), y0 = y;
      const from = Object.assign({}, cs);
      const to = { W: (s.lanes * LANE) / 2, SH: s.sh, M: s.med, O: s.opp ? (s.opp * LANE) / 2 : 0 };
      if (s.diverge && this.side === 1) { to.M = 0; to.O = 0; }
      if (s.diverge && this.side === -1) to.SH = 0;
      // after the divergence, a right branch's oncoming road slides in from far away
      if (this.side === 1 && j === 1) { from.M = Math.max(from.M, 70); }
      this.secStartS.push(idx * DS);
      for (let i = 0; i < m; i++) {
        const t = (i + 0.5) / m, kk = (s.k || 0) * curveProfile(t);
        h += kk * DS;
        x += Math.sin(h) * DS; z -= Math.cos(h) * DS;
        y = y0 + (s.dy || 0) * sstep((i + 1) / m);
        const into = (i + 1) * DS;
        const e = s.fork ? sstep(clamp(into / (s.len * 0.55), 0, 1)) : s.diverge ? sstep(clamp(into / (s.len * 0.9), 0, 1)) : sstep(clamp(into / 120, 0, 1));
        cs.W = lerp(from.W, to.W, s.fork ? sstep(clamp(into / (s.len * 0.45), 0, 1)) : e);
        cs.SH = lerp(from.SH, to.SH, e);
        cs.M = lerp(from.M, to.M, s.fork ? sstep(clamp(into / (s.len * 0.8), 0, 1)) : (this.side === 1 && j === 1) ? sstep(clamp(into / 380, 0, 1)) : e);
        cs.O = this.side === 1 && j === 1 ? lerp(from.O, to.O, sstep(clamp((into - 40) / 300, 0, 1))) : lerp(from.O, to.O, e);
        if (this.side === -1 && s.diverge) cs.SH = to.SH = lerp(0, first.sh, sstep(clamp((into - 120) / 300, 0, 1)));
        idx++;
        this.X[idx] = x; this.Y[idx] = y; this.Z[idx] = z; this.H[idx] = h; this.K[idx] = kk;
        this.W[idx] = cs.W; this.SH[idx] = cs.SH; this.M[idx] = cs.M; this.O[idx] = cs.O; this.SEC[idx] = j;
        this.F[idx] = s.fork ? sstep(clamp(into / (s.len * 0.5), 0, 1)) : 0;
      }
      if (s.diverge && this.side === -1) cs.SH = first.sh;
    }
    this.K[0] = this.K[1] || 0;
    this.end = { x, y, z, h, cs: Object.assign({}, cs) };
    // scenery, filled by the decorator
    this.colliders = []; this.sprites = []; this.walls = []; this.rails = []; this.wires = []; this.anim = [];
    this.innerFree = null; // for fork children: how far the inner ground may reach before the sibling's
  }
  fi(s) { const f = clamp(s / DS, 0, this.N - 1.0001); const i = Math.floor(f); return [i, f - i]; }
  sec(s) { const [i] = this.fi(s); return this.secs[this.SEC[i]]; }
  at(arr, s) { const [i, t] = this.fi(s); return lerp(arr[i], arr[i + 1], t); }
  heading(s) { if (s < 0 || s > this.L) return s < 0 ? this.H[0] : this.H[this.N - 1]; return this.at(this.H, s); }
  curv(s) { return this.at(this.K, s); }
  hw(s) { return this.at(this.W, s); }
  shoulder(s) { return this.at(this.SH, s); }
  fork(s) { return this.at(this.F, s); }
  // the edges a car can reach: the median barrier on the left, the outer edge of the shoulder on the right
  leftWall(s) { return -this.at(this.W, s) - 0.35; }
  rightEdge(s) { return this.at(this.W, s) + this.at(this.SH, s); }
  // world point at distance s and lateral offset x (right is +x); straight extrapolation off either end
  pos(s, x, out) {
    out = out || { x: 0, y: 0, z: 0 };
    let px, py, pz, h;
    if (s < 0) { h = this.H[0]; px = this.X[0] + Math.sin(h) * s; py = this.Y[0]; pz = this.Z[0] - Math.cos(h) * s; }
    else if (s > this.L) {
      if (this.next) return this.next.pos(s - this.L, x, out);
      const e = this.N - 1, d = s - this.L; h = this.H[e]; px = this.X[e] + Math.sin(h) * d; py = this.Y[e]; pz = this.Z[e] - Math.cos(h) * d;
    } else {
      const [i, t] = this.fi(s);
      px = lerp(this.X[i], this.X[i + 1], t); py = lerp(this.Y[i], this.Y[i + 1], t); pz = lerp(this.Z[i], this.Z[i + 1], t); h = lerp(this.H[i], this.H[i + 1], t);
    }
    out.x = px + Math.cos(h) * x; out.y = py; out.z = pz + Math.sin(h) * x;
    return out;
  }
  slope(s) { const a = clamp(s - 3, 0, this.L), b = clamp(s + 3, 0, this.L); return b > a ? (this.yAt(b) - this.yAt(a)) / (b - a) : 0; }
  yAt(s) { return this.at(this.Y, s); }
  // outer edges of the paved road on each side (where the ground begins)
  outerL(i) { return -(this.W[i] + this.M[i] + 2 * this.O[i] + (this.O[i] > 0.05 ? OPP_SH : 0)); }
  outerR(i) { return this.W[i] + this.SH[i]; }
}

function pcSetup(spec, auto) {

// ===================== the ghost: your best run on a route, replayed as a see-through car =====================
const GHOST = {
  rec: [], recT: 0, play: null, car: null, spr: null, p: null, s: 0, x: 0, on: false,
  // a sample every 0.1 s: which piece, how far along it, where across it

  },
  save(key) { SAVE.save('ghost:' + key, { car: CARS[RACE.carIdx].id, d: GHOST.rec }); SAVE.save('ghost:last', key); },
  // the fastest finished run we have, to race against from the start
  load() {
    const rec = SAVE.load('records', { routes: {} }); let best = null, bk = null;
    for (const k in rec.routes) if (!best || rec.routes[k].t < best.t) { best = rec.routes[k]; bk = k; }

    GHOST.play = g && g.d && g.d.length > 10 ? g : null; GHOST.on = !!GHOST.play;

  },
  // where the ghost is RACE.elapsed seconds in; it drops out when its route parts from ours

    if (!p) { GHOST.p = null; return; }
    if (a[0] === b[0]) { GHOST.p = p; GHOST.s = lerp(a[1], b[1], t); GHOST.x = lerp(a[2], b[2], t); } else { GHOST.p = p; GHOST.s = a[1]; GHOST.x = a[2]; }

function drawGhost(x, y, k, clip) {
